<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon-32x32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Enat">
<title>Enat Contas</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#0b0d12;--mute:#7a7f8c;--line:#e6e7ec;--blue:#0666eb;--green:#13a05a;--red:#e5484d;--amber:#e8a317;--chip:#ececf1;--hero1:#0a0f1f;--hero2:#16307a;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#16171b;--ink:#f5f6f8;--mute:#8d93a1;--line:#26282e;--blue:#3d8bff;--green:#35c97f;--red:#ff6b70;--chip:#26282e;--hero1:#10162b;--hero2:#1e3f9e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#16171b;--ink:#f5f6f8;--mute:#8d93a1;--line:#26282e;--blue:#3d8bff;--green:#35c97f;--red:#ff6b70;--chip:#26282e;--hero1:#10162b;--hero2:#1e3f9e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
main{max-width:520px;margin:0 auto;padding:12px 16px 110px}
h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:18px 0 14px;font-weight:700}
h2{font-size:20px;letter-spacing:-.01em;margin:26px 4px 10px;font-weight:700}
.sub{color:var(--mute);font-size:14px}
.hero{border-radius:26px;padding:22px 20px 18px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,var(--hero2),transparent 60%),var(--hero1);box-shadow:0 14px 34px -14px rgba(12,30,90,.55)}
.hero .l{font-size:14px;opacity:.7}.hero .big{font-size:44px;font-weight:700;letter-spacing:-.03em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.hero .big.neg{color:#ff9a9d}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin:16px 0 8px;background:rgba(255,255,255,.12)}
.bar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;opacity:.8}.leg b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.stats span{display:block;font-size:12px;opacity:.65}.stats b{font-size:15px;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.act{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;padding:0}
.act i{width:54px;height:54px;border-radius:50%;background:var(--card);display:grid;place-items:center;transition:transform .15s}
.act:active i{transform:scale(.92)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.grp{background:var(--card);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:66px;right:0;border-top:1px solid var(--line)}
.row.kv{cursor:default;padding:13px 16px}.row.kv::before{left:16px}
.av{width:40px;height:40px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:700;flex:none}
.av svg{width:19px;height:19px}
.rt{flex:1;min-width:0}.rt b,.rr b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rt span,.rr span{font-size:13px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{text-align:right;flex:none;max-width:45%}.rr b{font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}
.kv .rt{font-weight:400}.kv .rr b{font-weight:600}.kv.tot .rt,.kv.tot .rr b{font-weight:700}
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:2px;margin:18px 0 6px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.chips button{flex:none;border:0;background:var(--card);padding:8px 14px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;color:var(--mute)}
.chips button.on{background:var(--ink);color:var(--bg)}
.back{background:none;border:0;color:var(--blue);display:flex;align-items:center;gap:2px;padding:8px 0;font-size:17px;cursor:pointer}
.back svg{width:20px;height:20px;stroke-width:2.4}
.btn{display:block;width:100%;border:0;border-radius:15px;padding:15px;background:var(--blue);color:#fff;font-weight:600;font-size:17px;cursor:pointer;margin-top:14px}
.btn.alt{background:var(--chip);color:var(--ink)}.btn.del{background:none;color:var(--red)}
.link{background:none;border:0;color:var(--blue);padding:14px 4px;cursor:pointer;font-size:15px}
.tb{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.tb .bt{flex:1}.bt b{display:block;font-weight:600;font-size:14px}
.trk{height:8px;border-radius:5px;background:var(--chip);margin-top:6px;overflow:hidden}.trk i{display:block;height:100%;background:var(--blue);border-radius:5px}
.tpad{padding:12px 16px}
.empty{padding:28px 20px;text-align:center;color:var(--mute);font-size:15px}
.note{font-size:13px;color:var(--mute);margin:8px 6px 0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-top:1px solid var(--line)}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);padding:2px 0;cursor:pointer}
nav button.on{color:var(--blue)}
#ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
#ov.on{display:flex}
#sh{background:var(--bg);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40%);opacity:0}}
#sh .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
#sh h3{margin:4px 4px 12px;font-size:22px}
.fld{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden}
.fld label{display:flex;align-items:center;justify-content:space-between;padding:0 14px;min-height:50px;gap:12px}
.fld label+label{border-top:1px solid var(--line)}
.fld label>span{color:var(--mute);flex:none;font-size:15px}
.fld input,.fld select{border:0;background:none;text-align:right;outline:0;flex:1;min-width:0;font-size:16px}
.fld select{direction:rtl}
@media (prefers-reduced-motion:reduce){#sh{animation:none}.act i{transition:none}}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{max-width:520px;margin:0 auto;padding:12px 16px 0}.top img{height:38px;display:block;background:#fff;border-radius:10px;padding:2px 8px}
.sbar{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:0 12px;margin-bottom:12px}.sbar svg{width:18px;height:18px;color:var(--mute)}.sbar input{flex:1;border:0;background:none;outline:0;padding:11px 0;font-size:17px}a{color:var(--blue)}.btn svg{vertical-align:-5px;margin-right:6px}.chips{flex-wrap:nowrap}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="top"><img src="/enat-logo.png" alt="Enat Energias"></div>
<main id="app"></main>
<nav><div id="nav"></div></nav>
<div id="ov"><div id="sh" role="dialog" aria-modal="true"></div></div>
<input type="file" id="file" accept="image/*,application/pdf" hidden>
<script>
const $=s=>document.querySelector(s);
const eur=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(n||0);
const pc=n=>(isFinite(n)?n:0).toFixed(1).replace('.',',')+'%';
const fd=d=>{try{return new Date(d+'T12:00').toLocaleDateString('pt-PT',{day:'numeric',month:'short'})}catch(e){return d}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TOPICS=['VMC','Bomba de calor AQS','Bomba de calor climatização','Ar condicionado','Ventiloconvectores','UPAC (fotovoltaico)','Piso radiante','Geral / outros'];
const TY={recebimento:'Recebimento',fatura:'Fatura',despesa:'Despesa',mao_obra:'Mão de obra'};
const STAT={em_curso:'Em curso',concluida:'Concluída',orcamento:'Orçamento',pausada:'Pausada'};
const P={
 home:'<path d="M4 11l8-7 8 7v9H4zM10 20v-6h4v6"/>',obras:'<path d="M4 21V8l8-4 8 4v13M9 21v-6h6v6M9 11h6"/>',list:'<path d="M5 7h14M5 12h14M5 17h14"/>',
 iva:'<path d="M18 6L6 18"/><circle cx="7.5" cy="7.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/>',
 recebimento:'<path d="M12 5v14M6 13l6 6 6-6"/>',fatura:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',
 despesa:'<path d="M5 8h14l-1 12H6zM9 8a3 3 0 016 0"/>',mao_obra:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
 mat:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/>',manut:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 100-7 3.5 3.5 0 000 7z"/>',search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',back:'<path d="M15 5l-7 7 7 7"/>',chev:'<path d="M9 5l7 7-7 7"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${P[n]}</svg>`;

/* ---------- estado ---------- */
const demo=()=>({vat:23,obras:[
 {id:'o1',name:'Moradia T3 – Ponte de Lima',client:'Família Araújo',status:'em_curso',valor:18450},
 {id:'o2',name:'Climatização – Loja Centro',client:'Mercearia Sousa',status:'concluida',valor:6150}],
 tx:[
 {id:'t1',obra:'o1',type:'recebimento',desc:'Adjudicação 50%',topic:'',date:'2026-09-02',total:9225,rate:0},
 {id:'t2',obra:'o1',type:'fatura',desc:'Unidades interiores VMC',topic:'VMC',date:'2026-09-10',total:2460,rate:23},
 {id:'t3',obra:'o1',type:'fatura',desc:'Bomba de calor AQS 200L',topic:'Bomba de calor AQS',date:'2026-09-14',total:3198,rate:23},
 {id:'t4',obra:'o1',type:'fatura',desc:'Tubo de cobre e isolamento',topic:'Ar condicionado',date:'2026-09-21',total:984,rate:23},
 {id:'t5',obra:'o1',type:'mao_obra',desc:'Equipa de montagem · 6 dias',topic:'Geral / outros',date:'2026-10-05',total:2100,rate:0},
 {id:'t6',obra:'o1',type:'despesa',desc:'Gasóleo e refeições',topic:'Geral / outros',date:'2026-10-06',total:186.4,rate:0},
 {id:'t7',obra:'o2',type:'recebimento',desc:'Pagamento total',topic:'',date:'2026-10-12',total:6150,rate:0},
 {id:'t8',obra:'o2',type:'fatura',desc:'2 splits murais 18000 BTU',topic:'Ar condicionado',date:'2026-09-28',total:2214,rate:23},
 {id:'t9',obra:'o2',type:'mao_obra',desc:'Instalação · 2 dias',topic:'Ar condicionado',date:'2026-10-08',total:640,rate:0}]});
let S;try{S=JSON.parse(localStorage.getItem('enat-contas-2'))}catch(e){}
if(!S||!S.obras)S={vat:23,obras:[],tx:[]};S.inv=S.inv||[];
const save=()=>{S.ts=Date.now();try{localStorage.setItem('enat-contas-2',JSON.stringify(S))}catch(e){}push()};
let V={tab:'home',obra:null,seg:'contas',f:'todos'},D=null;

/* ---------- cálculos ---------- */
function calc(o){
 const t=S.tx.filter(x=>x.obra===o.id),s=(ty,k)=>t.filter(x=>x.type===ty).reduce((a,x)=>a+x[k],0);
 const base=o.valor/(1+S.vat/100),ivaLiq=o.valor-base;
 const fb=s('fatura','base'),fi=s('fatura','iva'),ft=s('fatura','total'),de=s('despesa','total'),mo=s('mao_obra','total'),rec=s('recebimento','total');
 const custo=fb+de+mo,lucro=base-custo,pago=ft+de+mo;
 return{o,t,base,ivaLiq,fb,fi,ft,de,mo,rec,custo,lucro,pago,margem:base?lucro/base*100:0,ivaEst:ivaLiq-fi,caixa:rec-pago,porRec:o.valor-rec};
}
const all=()=>S.obras.map(calc);
const sumC=a=>a.reduce((r,c)=>{for(const k of['base','ivaLiq','fb','fi','de','mo','rec','custo','lucro','pago','ivaEst','caixa','porRec'])r[k]=(r[k]||0)+c[k];r.valor=(r.valor||0)+c.o.valor;return r},{});
const withBase=x=>{if(x.fx)return x;const r=x.type==='fatura'?x.rate:0;x.rate=r;x.base=x.total/(1+r/100);x.iva=x.total-x.base;return x};
S.tx.forEach(withBase);

/* ---------- vistas ---------- */
const sg=n=>`<span class="${n>=0?'pos':'neg'}">${eur(n)}</span>`;
function hero(c,label){
 const seg=[[c.fb,'#6aa6ff','Materiais'],[c.mo+c.de,'#ffc45c','Mão de obra e despesas'],[Math.max(c.ivaEst,0),'#c9a4ff','IVA ao Estado'],[Math.max(c.lucro,0),'#4fe0a0','Lucro']];
 const tot=seg.reduce((a,x)=>a+x[0],0)||1;
 return`<section class="hero"><div class="l">${label}</div><div class="big ${c.lucro<0?'neg':''}">${eur(c.lucro)}</div>
 <div class="l">${c.valor?`${pc(c.base?c.lucro/c.base*100:0)} de margem · `:''}valor vendido ${eur(c.valor)} c/ IVA</div>
 <div class="bar" role="img" aria-label="Para onde vai o dinheiro cobrado">${seg.map(x=>`<i style="width:${x[0]/tot*100}%;background:${x[1]}"></i>`).join('')}</div>
 <div class="leg">${seg.map(x=>`<span><b style="background:${x[1]}"></b>${x[2]}</span>`).join('')}</div>
 <div class="stats"><div><span>Em caixa</span><b>${eur(c.caixa)}</b></div><div><span>Por receber</span><b>${eur(c.porRec)}</b></div><div><span>${c.ivaEst>=0?'IVA a entregar':'Crédito de IVA'}</span><b>${eur(Math.abs(c.ivaEst))}</b></div></div></section>`;
}
const acts=o=>`<div class="acts">${['recebimento','fatura','despesa','mao_obra'].map(t=>`<button class="act" data-a="newtx" data-t="${t}" ${o?`data-o="${o}"`:''}><i>${ic(t)}</i>${TY[t]}</button>`).join('')}</div>`;
const obraRow=c=>`<div class="row" data-a="open" data-id="${c.o.id}"><div class="av">${c.o.name[0]}</div><div class="rt"><b>${c.o.name}</b><span>${c.o.client} · ${STAT[c.o.status]}</span></div><div class="rr"><b>${sg(c.lucro)}</b><span>${pc(c.margem)}</span></div></div>`;
const txRow=(x,showObra)=>{const o=S.obras.find(o=>o.id===x.obra),inn=x.type==='recebimento';
 return`<div class="row" data-a="edittx" data-id="${x.id}"><div class="av">${ic(x.type)}</div><div class="rt"><b>${x.desc||TY[x.type]}</b><span>${[showObra&&o?o.name:'',x.topic,fd(x.date)].filter(Boolean).join(' · ')}</span></div><div class="rr"><b class="${inn?'pos':''}">${inn?'+':'−'}${eur(x.total)}</b><span>${TY[x.type]}${x.type==='fatura'?` · IVA ${x.rate}%`:''}</span></div></div>`};
const kv=(l,v,cls='')=>`<div class="row kv ${cls}"><div class="rt">${l}</div><div class="rr"><b>${v}</b></div></div>`;
const srt=a=>[...a].sort((x,y)=>y.date.localeCompare(x.date));

function vHome(){
 const a=all(),c=sumC(a);
 return`<h1>Início</h1>${hero(c,'Lucro previsto em todas as obras')}${acts()}
 <h2>Obras</h2><div class="grp">${a.length?a.map(obraRow).join(''):'<div class="empty">Sem obras. Crie a primeira no separador Obras.</div>'}</div>
 <h2>Últimos movimentos</h2><div class="grp">${S.tx.length?srt(S.tx).slice(0,5).map(x=>txRow(x,1)).join(''):'<div class="empty">Ainda sem movimentos.</div>'}</div>
 <p class="note">${SYNC==='ok'?'Dados sincronizados com a sua conta, em todos os dispositivos.':'Dados guardados neste dispositivo.'}</p><button class="link" data-a="xlsx">Descarregar Excel</button><button class="link" data-a="tab" data-id="mov">Ver todos os movimentos</button><button class="link" data-a="clear">Limpar todos os dados</button>`;
}
function vObras(){
 const a=all();
 return`<h1>Obras</h1><div class="grp">${a.length?a.map(obraRow).join(''):'<div class="empty">Sem obras ainda.</div>'}</div><button class="btn" data-a="newobra">Nova obra</button>`;
}
function vMov(){
 const fs=['todos',...Object.keys(TY)],l=srt(S.tx).filter(x=>V.f==='todos'||x.type===V.f);
 return`<h1>Movimentos</h1><div class="chips">${fs.map(f=>`<button class="${V.f===f?'on':''}" data-a="filt" data-id="${f}">${f==='todos'?'Todos':TY[f]}</button>`).join('')}</div>
 <div class="grp">${l.length?l.map(x=>txRow(x,1)).join(''):'<div class="empty">Nada por aqui. Use os atalhos do Início para registar.</div>'}</div>`;
}
function vIva(){
 const a=all(),c=sumC(a);
 return`<h1>IVA</h1><div class="grp">${kv('IVA cobrado aos clientes',eur(c.ivaLiq))}${kv('IVA suportado nas faturas',eur(-c.fi))}${kv(c.ivaEst>=0?'A entregar ao Estado':'Crédito de IVA',sg(c.ivaEst),'tot')}</div>
 <p class="note">Taxa aplicada aos valores das obras: ${S.vat}%. Despesas sem fatura e mão de obra não deduzem IVA.</p>
 <h2>Por obra</h2><div class="grp">${a.map(x=>`<div class="row" data-a="open" data-id="${x.o.id}" data-s="iva"><div class="av">${x.o.name[0]}</div><div class="rt"><b>${x.o.name}</b><span>Cobrado ${eur(x.ivaLiq)} · deduzido ${eur(x.fi)}</span></div><div class="rr"><b>${eur(x.ivaEst)}</b><span>${x.ivaEst>=0?'a entregar':'crédito'}</span></div></div>`).join('')||'<div class="empty">Sem obras.</div>'}</div>`;
}
function vObra(){
 const o=S.obras.find(o=>o.id===V.obra);if(!o){V.obra=null;return vHome()}
 const c=calc(o),tp={};
 c.t.filter(x=>x.type!=='recebimento').forEach(x=>{const k=x.topic||'Geral / outros';tp[k]=(tp[k]||0)+x.base});
 const mx=Math.max(...Object.values(tp),1);
 let body='';
 if(V.seg==='contas')body=`<h2>Cliente</h2><div class="grp">${kv('Valor da obra c/ IVA',eur(o.valor))}${kv('Recebido',eur(c.rec))}${kv('Por receber',eur(c.porRec),'tot')}</div>
 <h2>Custos sem IVA</h2><div class="grp">${kv('Materiais (faturas)',eur(c.fb))}${kv('Despesas sem fatura',eur(c.de))}${kv('Mão de obra',eur(c.mo))}${kv('Total de custos',eur(c.custo),'tot')}</div>
 <h2>Resultado</h2><div class="grp">${kv('Receita sem IVA',eur(c.base))}${kv('Custos',eur(-c.custo))}${kv('Lucro',sg(c.lucro),'tot')}${kv('Margem',pc(c.margem))}</div>
 <h2>Custo por tópico</h2><div class="grp tpad">${Object.keys(tp).length?Object.entries(tp).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-bottom:12px"><div class="tb"><div class="bt"><b>${k}</b></div><b>${eur(v)}</b></div><div class="trk"><i style="width:${v/mx*100}%"></i></div></div>`).join('').replace(/margin-bottom:12px"(?![\s\S]*margin-bottom)/,'"'):'<span class="sub">Sem custos registados.</span>'}</div>

async function toImages(f){
 if(f.type==='application/pdf'){
  if(!window.pdfjsLib)throw new Error('Leitor de PDF indisponível');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,out=[];
  for(let n=1;n<=Math.min(pdf.numPages,4);n++){const p=await pdf.getPage(n),v=p.getViewport({scale:1.7}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;out.push(await jpg(c))}
  return out}
 const bm=await createImageBitmap(f),k=Math.min(1,1800/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return[await jpg(c)]}
const b64=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(b)});
async function lerFatura(f){

 if(mime==='application/pdf'){if(f.size>4e6)throw new Error('PDF demasiado grande (máx. 4 MB). Envie uma foto')}
 else{blob=(await toImages(f))[0];mime='image/jpeg'}
 const code=localStorage.getItem('enat-code')||prompt('Código de acesso da app:');
 if(!code)throw new Error('sem código de acesso');
 const r=await fetch('/api/ler-fatura',{method:'POST',headers:{'content-type':'application/json','x-code':code},body:JSON.stringify({mime,data:await b64(blob)})});
 if(r.status===401){localStorage.removeItem('enat-code');throw new Error('código de acesso errado')}
 if(!r.ok)throw new Error('falha no servidor ('+r.status+')');
 localStorage.setItem('enat-code',code);LB=blob;LM=mime;return r.json()}

 else if(a==='back'){V.obra=null;V.tab='obras'}
 else if(a==='seg')V.seg=id;
 else if(a==='filt')V.f=id;
 else if(a==='newtx'){D={kind:'tx',type:b.dataset.t,obra:b.dataset.o||V.obra||(S.obras[0]||{}).id,date:today,rate:b.dataset.t==='fatura'?S.vat:0};sheet();return}
 else if(a==='edittx'){D={kind:'tx',...S.tx.find(x=>x.id===id)};sheet();return}
 else if(a==='ty'){D.type=id;D.rate=id==='fatura'?(D.rate||S.vat):0;sheet();return}
 else if(a==='newobra'){D={kind:'obra',status:'em_curso'};sheet();return}
 else if(a==='editobra'){D={kind:'obra',...S.obras.find(o=>o.id===id)};D.equip=[...(D.equip||[])];sheet();return}
 else if(a==='close'){D=null;sheet();return}
 else if(a==='savetx'){
  const t=num(D.total);if(!D.obra||t<=0){alert('Escolha uma obra e indique um valor maior que zero.');return}
  const x=withBase({id:D.id||uid(),obra:D.obra,type:D.type,desc:(D.desc||'').trim(),topic:D.type==='recebimento'?'':(D.topic||'Geral / outros'),date:D.date||today,total:t,rate:+D.rate||0});
  const i=S.tx.findIndex(y=>y.id===x.id);i<0?S.tx.push(x):S.tx[i]=x;save();D=null;sheet()}
 else if(a==='deltx'){S.tx=S.tx.filter(x=>x.id!==D.id);S.inv.filter(v=>v.tx===D.id&&v.foto).forEach(v=>API('foto/'+v.id,{method:'DELETE'}).catch(()=>{}));S.inv=S.inv.filter(v=>v.tx!==D.id);save();D=null;sheet()}
 else if(a==='saveobra'){
  if(!(D.name||'').trim()){alert('Dê um nome à obra.');return}
  const o={id:D.id||uid(),name:D.name.trim(),client:(D.client||'').trim()||'Sem cliente',status:D.status||'em_curso',valor:num(D.valor),phone:D.phone||'',done:D.done||'',equip:D.equip||[]};
  const i=S.obras.findIndex(y=>y.id===o.id);i<0?S.obras.push(o):S.obras[i]=o;save();D=null;sheet()}
 else if(a==='delobra'){if(!confirm('Eliminar a obra e todos os seus movimentos?'))return;S.obras=S.obras.filter(o=>o.id!==D.id);S.tx=S.tx.filter(x=>x.obra!==D.id);S.inv=S.inv.filter(v=>v.obra!==D.id);V.obra=null;save();D=null;sheet()}
 else if(a==='foto'){verFoto(id);return}
 else if(a==='xlsx'){xlsx();return}
 else if(a==='scan'){V.scanObra=b.dataset.o;$('#file').click();return}
 else if(a==='sug')V.q=id;
 else if(a==='mc')V.mc=id;
 else if(a==='eq'){D.equip=D.equip||[];const i=D.equip.indexOf(id);i<0?D.equip.push(id):D.equip.splice(i,1);sheet();return}
 else if(a==='saveinv'){const bs=num(D.base),t=num(D.total);if(bs<=0||t<=0){alert('Indique os totais sem IVA e com IVA.');return}
  const tid=uid(),st=(D.store||'').trim()||'Fornecedor';
  S.tx.push({id:tid,obra:D.obra,type:'fatura',desc:st+(D.number?' · '+D.number:''),topic:'Geral / outros',date:D.date,total:t,base:bs,iva:t-bs,rate:Math.round((t/bs-1)*100),fx:1});
  const iid=uid(),bl=D.blob,mm=D.mime;S.inv.push({id:iid,mime:mm,foto:bl?1:0,tx:tid,obra:D.obra,store:st,nif:D.nif,date:D.date,number:D.number,items:D.items});save();D=null;sheet();if(bl)subirFoto(iid,bl,mm)}
 else if(a==='clear'){if(!confirm('Apagar todas as obras e movimentos?'))return;S={vat:23,obras:[],tx:[]};save()}
 render();
});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset&&t.dataset.k;
 if(t.id==='q'){V.q=t.value;$('#res').innerHTML=matRes();return}
 if(t.dataset&&t.dataset.i!==undefined&&D&&D.items){D.items[+t.dataset.i].cat=t.value;return}
 if(k&&D)D[k]=t.value});
/* ---------- sincronização entre dispositivos ---------- */
let SYNC='off',pt;
const idle=()=>!D&&document.activeElement.tagName!=='INPUT';
const adopt=s=>{S=s;S.inv=S.inv||[];S.tx.forEach(withBase);try{localStorage.setItem('enat-contas-2',JSON.stringify(S))}catch(e){}if(idle())render()};
const setSync=s=>{if(SYNC!==s){SYNC=s;if(idle())render()}};
const push=()=>{clearTimeout(pt);pt=setTimeout(()=>API('estado',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({state:S,sheets:tabelas()})}).then(r=>setSync(r.ok?'ok':'off')).catch(()=>setSync('off')),900)};
async function pull(){try{const r=await API('estado');if(r.status===401){localStorage.removeItem('enat-code');return setSync('off')}const d=await r.json();
 if(!d.state){if(S.obras.length||S.tx.length)push();return setSync('ok')}
 const a=d.state.ts||0,b=S.ts||0;if(a>b)adopt(d.state);else if(a<b)push();setSync('ok')}catch(e){setSync('off')}}
if(!localStorage.getItem('enat-code')){const c=prompt('Código de acesso da app (para sincronizar e ler faturas):');if(c)localStorage.setItem('enat-code',c.trim())}
pull();setInterval(pull,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
render();
</script>
