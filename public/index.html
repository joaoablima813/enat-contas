 {id:'t1',obra:'o1',type:'recebimento',desc:'Adjudicação 50%',topic:'',date:'2026-09-02',total:9225,rate:0},
 {id:'t2',obra:'o1',type:'fatura',desc:'Unidades interiores VMC',topic:'VMC',date:'2026-09-10',total:2460,rate:23},

 {id:'t4',obra:'o1',type:'fatura',desc:'Tubo de cobre e isolamento',topic:'Ar condicionado',date:'2026-09-21',total:984,rate:23},
 {id:'t5',obra:'o1',type:'mao_obra',desc:'Equipa de montagem · 6 dias',topic:'Geral / outros',date:'2026-10-05',total:2100,rate:0},
 {id:'t6',obra:'o1',type:'despesa',desc:'Gasóleo e refeições',topic:'Geral / outros',date:'2026-10-06',total:186.4,rate:0},

/* ---------- histórico de navegação ---------- */
// O histórico guarda apenas referências locais às janelas, nunca dados no URL.
const navEntries=[];
let navIndex=1,navRestoring=false,navPending=false;
const navView=()=>({...V});
const navKey=d=>d?d.kind+':'+(d.id||d.invoiceId||'')+':'+(d.itemIndex??''):'';
navEntries[0]={v:navView(),d:null,y:0};
navEntries[1]={v:navView(),d:null,y:0};
history.replaceState({enatNav:0},'');
history.pushState({enatNav:1},'');
function trackNavigation(){
 if(navRestoring||navPending)return;
 const prev=navEntries[navIndex],v=navView();
 if(!D&&prev.d){
  let target=navIndex-1;
  while(target>1&&navEntries[target].d)target--;
  // Guardar ou cancelar descarta as folhas, sem as reabrir ao retroceder.
  navPending=true;history.go(target-navIndex);return;
 }
 if(prev.d?.kind==='loading'&&D){prev.d=D;return}
 if(JSON.stringify(prev.v)===JSON.stringify(v)&&navKey(prev.d)===navKey(D)){
  prev.d=D;return;
 }
 prev.y=window.scrollY;
 navEntries.splice(navIndex+1);
 navEntries.push({v,d:D,y:0});
 history.pushState({enatNav:++navIndex},'');
}
window.addEventListener('popstate',e=>{
 const index=e.state?.enatNav;
 if(!Number.isInteger(index)||!navEntries[index])return;
 if(D?.saving){if(index!==navIndex)history.go(navIndex-index);return}
 navPending=false;
 if(index===0){history.pushState({enatNav:1},'');navIndex=1;return}
 const entry=navEntries[index];navIndex=index;
 navRestoring=true;
 if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}
 V={...entry.v};D=entry.d;
 if(V.obra&&!S.obras.some(o=>o.id===V.obra)){V.obra=null;V.tab='obras'}
 render();
 if(D?.kind==='view')verFoto(D.invoiceId);else sheet();
 window.scrollTo(0,entry.y||0);
 navRestoring=false;
});

/* ---------- cálculos ---------- */
function calc(o){
 const t=S.tx.filter(x=>x.obra===o.id),s=(ty,k)=>t.filter(x=>x.type===ty).reduce((a,x)=>a+x[k],0);
 const base=o.valor/(1+S.vat/100),ivaLiq=o.valor-base;
 const fb=s('fatura','base'),fi=s('fatura','iva')+s('mao_obra','iva'),ft=s('fatura','total'),de=s('despesa','total'),mo=s('mao_obra','base'),mt=s('mao_obra','total'),mi=s('mao_obra','iva'),rec=s('recebimento','total');
 const custo=fb+de+mo,lucro=base-custo,pago=ft+de+mt;
 return{o,t,base,ivaLiq,fb,fi,ft,de,mo,mt,mi,rec,custo,lucro,pago,margem:base?lucro/base*100:0,ivaEst:ivaLiq-fi,caixa:rec-pago,porRec:o.valor-rec};
}

 return`<section class="hero"><div class="l">${label}</div><div class="big ${c.lucro<0?'neg':''}">${eur(c.lucro)}</div>

const CATS=['Equipamentos','Material elétrico','Cablagem','Cobre','Tubagem','Acessórios e fixação','Outros / consumíveis'];
// Normaliza uma linha lida: unit_price é o preço líquido (com desconto); list_price e discount só existem quando há desconto.
function lineItem(i){
 const qty=fin(i.qty)>0?+i.qty:1,tot=fin(i.total_no_vat);let net=fin(i.unit_price),list=fin(i.list_price),disc=fin(i.discount);
 if(disc!==null&&(disc<=0||disc>=100))disc=null;
 if(list!==null&&list<=0)list=null;
 if(net===null&&tot!==null)net=tot/qty;
 if(net===null&&list!==null)net=disc?list*(1-disc/100):list;
 // Se o preço líquido veio igual ao de tabela, usa o total da linha ou a percentagem para aplicar o desconto.
 if(disc&&net!==null&&(list===null||Math.abs(list-net)<0.005)){if(list===null&&tot!==null&&Math.abs(tot/qty-net)>0.005){list=net;net=tot/qty}else{list=list??net;net=list*(1-disc/100)}}
 if(list!==null&&net!==null&&list>net+0.004){disc=disc??(1-net/list)*100}else{list=null;disc=null}
 net=net??0;
 return{name:String(i.name||'Artigo'),qty,unit:i.unit||'un',unit_price:net,...(list!==null?{list_price:Math.round(list*1e4)/1e4,discount:r2(disc)}:{}),vat:fin(i.vat)??23,total:tot??qty*net,cat:CATS.includes(i.cat)?i.cat:'Outros / consumíveis'};
}

async function xlsx(){

 try{
  const wb=EnatExcel.createWorkbook(ExcelJS,tabelas(),all());
  const buffer=await wb.xlsx.writeBuffer();
  const url=URL.createObjectURL(new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const link=document.createElement('a');link.href=url;link.download='enat-contas-'+new Date().toISOString().slice(0,10)+'.xlsx';link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);

}

function matchesProduct(name,query){
 const words=norm(name).match(/[a-z0-9]+/g)||[];
 const terms=(norm(query).match(/[a-z0-9]+/g)||[]).filter(w=>!['de','do','da','dos','das','em','e'].includes(w));
 return terms.length>0&&terms.every(term=>words.some(word=>word.startsWith(term)));
}

function matRes(){

  const recent=S.inv.slice().reverse().slice(0,3);
  return`<h2>Últimas faturas anexadas</h2><div class="grp">${recent.length?recent.map(invRow).join(''):'<div class="empty">Ainda sem faturas. Dentro de uma obra, adicione uma foto ou PDF.</div>'}</div>${all.length?productList(all.slice(0,30),'Produtos recentes'):''}${tableBrands()}`}

}

async function contab(zip){

 const get=(blob,file)=>{const url=URL.createObjectURL(blob),l=document.createElement('a');l.href=url;l.download=file;l.click();setTimeout(()=>URL.revokeObjectURL(url),10000)};
 try{
  const x=new Uint8Array(await EnatContab.accountantWorkbook(ExcelJS,S,p.from,p.to,p.label).xlsx.writeBuffer());
  if(!zip)return get(new Blob([x],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name+'.xlsx');

  get(new Blob([EnatContab.makeZip(files)],{type:'application/zip'}),name+'.zip');

}

const jpg=c=>new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('Não foi possível preparar a foto.')),'image/jpeg',.9));
async function toImages(f){
 if(f.type==='application/pdf'){
  if(!window.pdfjsLib)throw new Error('Leitor de PDF indisponível');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,out=[];
  for(let n=1;n<=Math.min(pdf.numPages,4);n++){const p=await pdf.getPage(n),v=p.getViewport({scale:1.7}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;out.push(await jpg(c))}
  return out}
 let bm;try{bm=await createImageBitmap(f)}catch{const url=URL.createObjectURL(f);try{bm=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Não foi possível abrir a foto. Escolha JPEG ou PNG.'));im.src=url})}finally{URL.revokeObjectURL(url)}}const k=Math.min(1,1800/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(bm,0,0,c.width,c.height);bm.close?.();return[await jpg(c)]}
const b64=b=>new Promise((resolve,reject)=>{const x=new FileReader();x.onload=()=>resolve(x.result.split(',')[1]);x.onerror=()=>reject(new Error('Não foi possível abrir o ficheiro.'));x.readAsDataURL(b)});

async function lerFatura(f){
 let blob=f,mime=f.type||(/\.pdf$/i.test(f.name)?'application/pdf':'');
 if(mime==='application/pdf'){if(f.size>4e6)throw new Error('PDF demasiado grande (máx. 4 MB). Envie uma foto')}
 else{blob=(await toImages(f))[0];mime='image/jpeg'}
 const r=await API('ler-fatura',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mime,data:await b64(blob)})});
 if(r.status===401)throw new Error('sessão terminada, entre de novo')
 if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||'falha no servidor ('+r.status+')')}
 LB=blob;LM=mime;return r.json()}

document.addEventListener('click',async e=>{
 if(D?.saving)return;
 if(e.target.id==='ov'){D=null;sheet();return}
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,id=b.dataset.id,today=new Date().toISOString().slice(0,10);
 if(a==='tab'){V.tab=id;V.obra=null;V.cli='';if(id==='def')COPIAS=null;window.scrollTo(0,0)}
 else if(a==='open'){V.obra=id;V.seg=b.dataset.s||'contas';window.scrollTo(0,0)}
 else if(a==='back'){history.back();return}
 else if(a==='seg')V.seg=id;
 else if(a==='filt')V.f=id;
 else if(a==='newtx'&&b.dataset.t==='mao_obra'){D={kind:'labor',obra:b.dataset.o||V.obra||(S.obras[0]||{}).id,date:today,entries:[{topic:'Geral / outros',desc:'',total:'',billing:'nao_faturado'}]};sheet();return}
 else if(a==='newtx'){D={kind:'tx',type:b.dataset.t,obra:b.dataset.o||V.obra||(S.obras[0]||{}).id,date:today,rate:b.dataset.t==='fatura'?S.vat:0};sheet();return}
 else if(a==='edittx'){D={kind:'tx',...S.tx.find(x=>x.id===id)};sheet();return}
 else if(a==='ty'){D.type=id;D.rate=id==='fatura'?(D.rate||S.vat):0;sheet();return}
 else if(a==='newobra'){D={kind:'obra',status:'em_curso',plano:EnatGestao.defaultPlan(today)};sheet();return}
 else if(a==='editobra'){D={kind:'obra',...S.obras.find(o=>o.id===id)};D.equip=[...(D.equip||[])];D.plano=structuredClone(D.plano||[]);sheet();return}
 else if(a==='close'){D=null;sheet();return}
 else if(a==='savetx'){
  const t=num(D.total);if(!D.obra||t<=0){alert('Escolha uma obra e indique um valor maior que zero.');return}
  const x=withBase({id:D.id||uid(),obra:D.obra,type:D.type,desc:(D.desc||'').trim(),topic:D.type==='recebimento'?'':(D.topic||'Geral / outros'),date:D.date||today,total:t,billing:D.type==='mao_obra'?(D.billing||'nao_faturado'):undefined,rate:+D.rate||0});
  const i=S.tx.findIndex(y=>y.id===x.id);i<0?S.tx.push(x):S.tx[i]=x;save();D=null;sheet()}
 else if(a==='deltx'){S.tx=S.tx.filter(x=>x.id!==D.id);S.inv.filter(v=>v.tx===D.id&&v.foto).forEach(v=>API('foto/'+v.id,{method:'DELETE'}).catch(()=>{}));S.inv=S.inv.filter(v=>v.tx!==D.id);save();D=null;sheet()}
 else if(a==='saveobra'){
  if(!(D.name||'').trim()){alert('Dê um nome à obra.');return}
  const plano=(D.plano||[]).map((m,i)=>({desc:String(m.desc||'').trim()||'Prestação '+(i+1),pct:num(m.pct),date:m.date||''}));
  if(plano.length&&(plano.some(m=>m.pct<=0)||Math.abs(plano.reduce((s,m)=>s+m.pct,0)-100)>.01)){alert('As percentagens do plano de pagamentos têm de ser maiores que zero e somar 100%.');return}
  // Mantém os dados que não estão no formulário, como o orçamento de origem e os custos previstos.
  const old=S.obras.find(y=>y.id===D.id)||{};
  const o={...old,id:D.id||uid(),name:D.name.trim(),client:(D.client||'').trim()||'Sem cliente',status:D.status||'em_curso',valor:num(D.valor),phone:D.phone||'',email:(D.email||'').trim(),nif:(D.nif||'').trim(),address:(D.address||'').trim(),done:D.done||'',equip:D.equip||[],plano};
  const i=S.obras.findIndex(y=>y.id===o.id);i<0?S.obras.push(o):S.obras[i]=o;save();D=null;sheet()}
 else if(a==='delobra'){if(!confirm('Eliminar a obra e todos os seus movimentos?'))return;S.obras=S.obras.filter(o=>o.id!==D.id);S.tx=S.tx.filter(x=>x.obra!==D.id);S.inv=S.inv.filter(v=>v.obra!==D.id);V.obra=null;save();D=null;sheet()}
 else if(a==='of')V.of=id;
 else if(a==='oy')V.oy=id;
 else if(a==='per')V.per=id;
 else if(a==='cli'){V.cli=id;window.scrollTo(0,0)}
 else if(a==='openquote'){const qid=Number(id);V.tab='orc';V.obra=null;quoteClient=null;window.scrollTo(0,0);if(quoteRows===null||!quoteRows.some(r=>r.id===qid))await loadQuotes();quoteOpen(qid);if(!quoteDraft)alert('Orçamento não encontrado.')}
 else if(a==='cliquote'){const c=EnatGestao.clients(S.obras,quoteRows||[]).find(c=>c.key===id);V.tab='orc';V.obra=null;quoteClient=null;quoteWa.key=null;quoteDraft=newQuote();if(c)Object.assign(quoteDraft,{client:c.name,address:c.address,contact:c.phone,email:c.email});window.scrollTo(0,0)}
 else if(a==='quickscan'){D={kind:'pickobra'};sheet();return}
 else if(a==='planadd'){const p=D.plano||[];D.plano=[...p,{desc:'',pct:Math.max(0,r2(100-p.reduce((s,m)=>s+num(m.pct),0))),date:''}];sheet();return}
 else if(a==='planrm'){D.plano.splice(+id,1);sheet();return}
 else if(a==='plan5050'){D.plano=EnatGestao.defaultPlan(today);sheet();return}
 else if(a==='contab'||a==='contabxlsx'){contab(a==='contab');return}
 else if(a==='syncnow'){clearTimeout(pt);sendState().then(r=>r&&pull()).catch(()=>setSync('off'));return}
 else if(a==='copianow'){copiaAgora().then(()=>{COPIAS=null;render();alert('Cópia de segurança feita.')}).catch(e=>alert(e.message));return}
 else if(a==='restore'){restaurar(id);return}
 else if(a==='tprod'){D={kind:'tprod',b:Number(b.dataset.b),itemIndex:Number(b.dataset.index)};sheet();return}
 else if(a==='product'){D={kind:'product',id,itemIndex:Number(b.dataset.index)};sheet();return}
 else if(a==='invoice'){if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}D={kind:'invoice',id};sheet();return}
 else if(a==='addlabor'){D.entries.push({topic:'Geral / outros',desc:'',total:'',billing:'nao_faturado'});sheet();return}
 else if(a==='removelabor'){D.entries.splice(+id,1);sheet();return}
 else if(a==='savelabor'){
  if(!S.obras.some(o=>o.id===D.obra)||D.entries.some(x=>num(x.total)<=0)){alert('Escolha uma obra e indique um valor maior que zero em cada linha.');return}
  D.entries.forEach(x=>S.tx.push(withBase({id:uid(),obra:D.obra,type:'mao_obra',desc:x.desc.trim(),topic:x.topic,date:D.date||today,total:num(x.total),billing:x.billing||'nao_faturado',rate:0})));
  save();D=null;sheet();
 }
 else if(a==='foto'){verFoto(id);return}
 else if(a==='xlsx'){xlsx();return}
 else if(a==='sair'){bloquear();return}
 else if(a==='novodisp'){registar().then(()=>alert('Dispositivo registado.')).catch(e=>alert(e.name==='NotAllowedError'?'Operação cancelada.':(e.message||'Erro')));return}
 else if(a==='scan'){if(!b.dataset.o){alert('Escolha uma obra primeiro.');return}V.scanObra=b.dataset.o;$('#file').click();return}
 else if(a==='sug')V.q=id;
 else if(a==='mc')V.mc=id;
 else if(a==='reread'){reread();return}
 else if(a==='eq'){D.equip=D.equip||[];const i=D.equip.indexOf(id);i<0?D.equip.push(id):D.equip.splice(i,1);sheet();return}
 else if(a==='saveinv'){
  if(D.saving)return;
  const bs=num(D.base),t=num(D.total);if(bs<=0||t<=0||t<bs){alert('Confirme os totais sem IVA e com IVA.');return}
  if(!S.obras.some(o=>o.id===D.obra)){alert('Escolha uma obra para esta fatura.');return}
  const d=D;d.saving=true;b.disabled=true;b.textContent='A guardar fatura e anexo…';
  try{
   const iid=d.iid||(d.iid=uid());
   await subirFoto(iid,d.blob,d.mime);
   const tid=uid(),st=(d.store||'').trim()||'Fornecedor';
   S.tx.push({id:tid,obra:d.obra,type:'fatura',desc:st+(d.number?' · '+d.number:''),topic:'Geral / outros',date:d.date,total:t,base:bs,iva:t-bs,rate:Math.round((t/bs-1)*100),fx:1});
   S.inv.push({id:iid,mime:d.mime,foto:1,tx:tid,obra:d.obra,store:st,nif:d.nif,date:d.date,number:d.number,items:d.items,rv:1});save();
   clearTimeout(pt);
   if(!(await sendState().catch(()=>null)))throw new Error('O anexo foi enviado, mas falta sincronizar a fatura.');
   D=null;sheet();
  }catch(err){
   const v=S.inv.find(v=>v.id===d.iid);
   if(v){S.inv=S.inv.filter(x=>x!==v);S.tx=S.tx.filter(x=>x.id!==v.tx);save();}
   d.saving=false;D=d;sheet();alert(err.message||'Não foi possível guardar. Tente novamente.');
  }
 }
 else if(a==='clear'){
  // Apagar tudo pede confirmação escrita e guarda antes uma cópia de segurança no servidor.
  if((prompt('Isto apaga todas as obras, movimentos e faturas em todos os dispositivos. Para confirmar, escreva APAGAR')||'').trim().toUpperCase()!=='APAGAR')return;
  try{await copiaAgora()}catch(e){alert(e.message+' Nada foi apagado.');return}
  S={vat:S.vat,obras:[],tx:[],inv:[],del:S.del||{}};save();COPIAS=null;alert('Dados apagados. Pode recuperá-los em Definições › Cópias de segurança.')}
 render();
});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset&&t.dataset.k;
 if(t.id==='q'){V.q=t.value;navEntries[navIndex].v=navView();$('#res').innerHTML=matRes();return}
 if(t.id==='gq'){V.gq=t.value;navEntries[navIndex].v=navView();ensureQuotes();$('#gres').innerHTML=globalRes();$('#homebody').hidden=!!t.value.trim();return}
 if(t.id==='oq'){V.oq=t.value;navEntries[navIndex].v=navView();$('#olist').innerHTML=obrasList();return}
 if(t.id==='cq'){V.cq=t.value;navEntries[navIndex].v=navView();$('#clist').innerHTML=clientsList();return}
 if(t.dataset?.plan!==undefined&&D?.plano){D.plano[+t.dataset.plan][t.dataset.field]=t.dataset.field==='pct'?num(t.value):t.value;return}
 if(t.dataset&&t.dataset.i!==undefined&&D&&D.items){D.items[+t.dataset.i].cat=t.value;return}
 if(t.dataset?.pcat!==undefined){const p=products().find(p=>p.key===t.dataset.pcat);if(p){p.buys.forEach(b=>b.i.cat=t.value);save()}return}
 if(t.dataset?.labor!==undefined&&D?.entries){D.entries[+t.dataset.labor][t.dataset.field]=t.value;return}
 if(k&&D)D[k]=t.value});
/* ---------- sincronização entre dispositivos ---------- */
let SYNC='off',pt,SYNCAT=0,OFFLINE=false;
// BASE: versão do servidor que este dispositivo conhece. Se outro dispositivo gravou depois, as duas versões juntam-se.
let BASE=(()=>{const v=localStorage.getItem('enat-base');return v===null?null:+v})();
const setBase=t=>{BASE=t;try{localStorage.setItem('enat-base',String(t))}catch(e){}};
const keep=()=>{try{localStorage.setItem('enat-contas-2',JSON.stringify(S))}catch(e){}};
const idle=()=>!D&&!quoteDraft&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
const adopt=s=>{S=s;S.inv=S.inv||[];S.tx.forEach(withBase);LAST=EnatSync.snap(S);keep();if(idle())render()};
function mergeRemote(r){S=EnatSync.merge(S,r);S.inv=S.inv||[];S.tx.forEach(withBase);LAST=EnatSync.snap(S);setBase(r.ts||0);S.ts=Date.now();keep();if(idle())render()}
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'agora':m<60?'há '+m+' min':'há '+Math.round(m/60)+' h'};
const syncText=()=>SYNC==='saving'?'A sincronizar…':SYNC==='ok'?'Sincronizado '+ago(SYNCAT):OFFLINE||!navigator.onLine?'Sem ligação · guardado neste dispositivo':'Por sincronizar · guardado neste dispositivo';
function syncPill(){const b=$('#sync');if(!b)return;b.className='sync '+SYNC;b.textContent=SYNC==='ok'?'Sincronizado':SYNC==='saving'?'A sincronizar…':OFFLINE||!navigator.onLine?'Sem ligação':'Por sincronizar';b.title=syncText()}
const setSync=s=>{SYNC=s;syncPill()};
async function sendState(tries=3){
 if(OFFLINE||!SESS()){setSync('off');return null}
 const sent=S.ts;setSync('saving');
 const r=await API('estado',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({state:S,base:BASE,sheets:tabelas()})});
 if(r.status===409&&tries>0){mergeRemote((await r.json()).state);return sendState(tries-1)}
 if(!r.ok)throw new Error('sync');
 setBase(sent);SYNCAT=Date.now();setSync(S.ts===sent?'ok':'saving');return r;
}
const push=()=>{clearTimeout(pt);setSync('saving');pt=setTimeout(()=>sendState().catch(()=>setSync('off')),900)};
async function pull(){if(OFFLINE)return;try{const r=await API('estado');if(r.status===401)return setSync('off');const d=await r.json();
 if(!d.state){if(S.obras.length||S.tx.length)push();else{SYNCAT=Date.now();setSync('ok')}return}
 const remote=d.state.ts||0,dirty=(S.ts||0)!==BASE;
 if(remote===BASE){if(dirty)push();else{SYNCAT=Date.now();setSync('ok')}return}
 if(dirty){mergeRemote(d.state);push()}else{adopt(d.state);setBase(remote);SYNCAT=Date.now();setSync('ok')}
}catch(e){setSync('off')}}
/* ---------- entrada com Face ID / Touch ID (passkeys) ---------- */
const post=async(p,b,code)=>{const r=await fetch('/api/'+p,{method:'POST',headers:{'content-type':'application/json','x-session':SESS(),...(code?{'x-code':code}:{})},body:JSON.stringify(b||{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'falha ('+r.status+')');return j};
let LIGADO=false;
function bloquear(m){sessionStorage.removeItem('enat-sess');$('#lock').classList.add('on');ecraLock(m)}
const CRED=()=>localStorage.getItem('enat-cred')||'';
async function ecraLock(m,falhou){const lk=$('#lk');
 lk.innerHTML='<button class="btn" disabled aria-busy="true">Login</button>';
 let tem=true,semRede=!navigator.onLine;try{tem=(await (await fetch('/api/auth/estado')).json()).temChaves}catch(e){semRede=true}
 // Sem rede, o Face ID / Touch ID deste dispositivo abre os dados guardados nele; sincroniza quando a ligação voltar.
 const local=semRede&&CRED()&&(S.obras.length||S.tx.length)&&window.PublicKeyCredential;
 const aviso=window.PublicKeyCredential?'':'<p class="neg" role="alert">Este navegador não suporta Face ID / Touch ID.</p>';
 const erro=m?`<p class="neg" role="alert">${esc(m)}</p>`:'';
 lk.innerHTML=aviso+erro+`<button class="btn" data-l="${tem?'entrar':'registar'}">Login</button>`+
 (falhou&&tem?'<button class="link" data-l="novo">Registar este dispositivo</button>':'')+
 (local?'<p style="margin-top:18px">Sem ligação à internet.</p><button class="btn alt" data-l="offline">Entrar sem ligação</button><p class="note">Usa os dados guardados neste dispositivo. As alterações sincronizam quando a internet voltar.</p>':'')}
async function entrarOffline(){
 const id=Uint8Array.from(atob(CRED().replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
 await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:'public-key',id}],userVerification:'required',timeout:60000}});
 OFFLINE=true;$('#lock').classList.remove('on');setSync('off');render();
}
window.addEventListener('online',()=>{if(OFFLINE){OFFLINE=false;bloquear('A ligação voltou. Faça login para sincronizar as alterações feitas sem rede.')}else if(SESS())pull()});
window.addEventListener('offline',()=>setSync('off'));

function desbloquear(t){OFFLINE=false;sessionStorage.setItem('enat-sess',t);$('#lock').classList.remove('on');if(!LIGADO){LIGADO=true;setInterval(()=>{pull();syncPill();quoteRefresh()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SESS())pull()})}pull();render()}
async function registar(code){const o=await post('auth/registo-opcoes',{},code);const response=await SWA.startRegistration({optionsJSON:o.options});const t=(await post('auth/registo',{cid:o.cid,response},code)).token;localStorage.setItem('enat-cred',response.id);desbloquear(t)}
// Face ID: vai direto à chave guardada neste dispositivo. Touch ID: deixa o sistema escolher qualquer chave (outro sensor ou dispositivo).
async function entrar(local){const o=await post('auth/entrar-opcoes',local&&CRED()?{id:CRED()}:{});const response=await SWA.startAuthentication({optionsJSON:o.options});const t=(await post('auth/entrar',{cid:o.cid,response})).token;if(response.authenticatorAttachment!=='cross-platform')localStorage.setItem('enat-cred',response.id);desbloquear(t)}
$('#lock').addEventListener('click',async e=>{const b=e.target.closest('[data-l]');if(!b)return;
 if(b.dataset.l==='offline'){try{b.disabled=true;await entrarOffline()}catch(err){ecraLock(err.name==='NotAllowedError'?'Operação cancelada.':'Não foi possível confirmar a identidade.')}return}
 if(!window.SWA){ecraLock('A carregar, tente de novo dentro de um segundo.');return}
 try{const l=b.dataset.l;b.disabled=true;
  if(l==='entrar'){try{await entrar(false)}catch(err){return ecraLock(err.name==='NotAllowedError'?'':(err.message||'Erro'),true)}}
  else if(l==='touch')await entrar(false);
  else if(l==='registar')await registar();
  else if(l==='novo'){const c=SESS()?'':prompt('Para registar um novo dispositivo, indique o código de acesso (APP_CODE):');if(c===null)return ecraLock('',true);await registar((c||'').trim())}
 }catch(err){ecraLock(err.name==='NotAllowedError'?'Operação cancelada.':(err.message||'Erro'),b.dataset.l!=='registar')}});
if(SESS())desbloquear(SESS());else bloquear();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
